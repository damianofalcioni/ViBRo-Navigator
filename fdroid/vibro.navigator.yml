Categories:
  - Navigation
License: MIT
AuthorName: Damiano Falcioni
Summary: Vibrating/Vibe-coded BRouter Navigator is a lightweight, offline-first, and battery-efficient Android navigation app built on top of BRouter

# Replace these with the final public GitHub URLs before submitting to fdroiddata.
WebSite: https://damianofalcioni.github.io/ViBRo-Navigator/
SourceCode: https://github.com/damianofalcioni/ViBRo-Navigator
IssueTracker: https://github.com/damianofalcioni/ViBRo-Navigator/issues
RepoType: git
Repo: https://github.com/damianofalcioni/ViBRo-Navigator.git

Builds:
  - versionName: "0.1.13"
    versionCode: 13
    # Prefer the release tag once it exists, e.g. v0.1.13.
    # A fixed commit hash also works for the initial submission.
    commit: REPLACE_WITH_RELEASE_TAG_OR_COMMIT
    rm: local.properties
    gradle:
      - fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v?[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app/build.gradle|versionCode = (\d+)|.|versionName = "([^"]+)"
CurrentVersion: "0.1.13"
CurrentVersionCode: 13

# Optional once you publish a signed upstream APK and want F-Droid to verify it:
# AllowedAPKSigningKeys: REPLACE_WITH_APKSIGNER_SHA256_FINGERPRINT
