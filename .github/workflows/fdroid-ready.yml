name: F-Droid Readiness

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Optional release tag or commit to verify, for example v0.1.0"
        required: false
        default: ""
  workflow_call:
    inputs:
      release_ref:
        description: "Optional release tag or commit to verify, for example v0.1.0"
        required: false
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      READINESS_REF: ${{ inputs.release_ref || github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      - name: Verify F-Droid metadata and tag version
        shell: bash
        run: |
          set -euo pipefail

          version_name="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle | head -n1)"
          version_code="$(sed -n 's/.*versionCode = \(.*\)/\1/p' app/build.gradle | head -n1)"

          test -n "$version_name"
          test -n "$version_code"

          required_files=(
            fastlane/metadata/android/en-US/title.txt
            fastlane/metadata/android/en-US/short_description.txt
            fastlane/metadata/android/en-US/full_description.txt
            "fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          )

          for path in "${required_files[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

          screenshot_count="$(find fastlane/metadata/android/en-US/images/phoneScreenshots -maxdepth 1 -type f | wc -l)"
          if [ "$screenshot_count" -lt 2 ]; then
            echo "Expected at least 2 phone screenshots for store metadata"
            exit 1
          fi

          tag_name=""
          tag_candidate="${READINESS_REF#refs/tags/}"
          if git rev-parse --verify --quiet "refs/tags/${tag_candidate}^{commit}" >/dev/null; then
            tag_name="${tag_candidate}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME}"
          fi

          if [[ -n "${tag_name}" ]]; then
            if [[ "${tag_name}" != "v${version_name}" && "${tag_name}" != "${version_name}" ]]; then
              echo "Tag ${tag_name} does not match versionName ${version_name}"
              exit 1
            fi
          fi

      - name: Run lint, maintainability checks, and tests
        run: ./gradlew lintFdroidDebug lintGplayDebug complexityCheck testFdroidDebugUnitTest testGplayDebugUnitTest

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release-keystore.jks

      - name: Build signed F-Droid release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleFdroidRelease

      - name: Verify signed F-Droid release artifact
        shell: bash
        run: |
          set -euo pipefail
          ls app/build/outputs/apk/fdroid/release/
          test -f app/build/outputs/apk/fdroid/release/app-fdroid-release.apk

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-release-apk
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
