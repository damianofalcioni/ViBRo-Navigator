plugins {
    id "com.android.application"
    id "pmd"
}

pmd {
    consoleOutput = true
    toolVersion = "7.24.0"
    ruleSetFiles = files("$rootDir/config/pmd/ai-maintainability-ruleset.xml")
    ruleSets = []
}

tasks.register("complexityCheck", Pmd) {
    group = "verification"
    description = "Runs the enforced PMD maintainability baseline on production Java sources."

    source = files(
            fileTree("src/main/java") {
                include "**/*.java"
            },
            fileTree("src/fdroid/java") {
                include "**/*.java"
            },
            fileTree("src/gplay/java") {
                include "**/*.java"
            },
            fileTree("src/test/java") {
                include "**/*.java"
            },
            fileTree("src/testFdroid/java") {
                include "**/*.java"
            },
            fileTree("src/testGplay/java") {
                include "**/*.java"
            }
    )
    ruleSetFiles = files("$rootDir/config/pmd/ai-maintainability-ruleset.xml")
    ruleSets = []
    ignoreFailures = false
    maxFailures = 0

    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named("check").configure {
    dependsOn("complexityCheck")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation"]
}

tasks.withType(Test).configureEach {
    maxHeapSize = "1536m"
}

android {
    namespace = "vibro.navigator"
    compileSdk = 37

    defaultConfig {
        applicationId = "vibro.navigator"
        minSdk = 23
        targetSdk = 37
        versionCode = 1
        versionName = "0.1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "distribution"

    productFlavors {
        gplay {
            dimension = "distribution"
        }
        fdroid {
            dimension = "distribution"
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    
    buildFeatures {
        resValues = true
        buildConfig = true
        aidl = true
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            resValue "string", "app_name", "ViBRo Debug"
        }
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            } else {
                // fallback for local builds
                // signingConfig signingConfigs.debug
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation "androidx.core:core:1.19.0"

    gplayImplementation "com.google.android.gms:play-services-location:21.4.0"
    gplayImplementation "androidx.car.app:app:1.7.0"
    gplayImplementation "androidx.car.app:app-projected:1.7.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "org.json:json:20260719"
    testImplementation "org.robolectric:robolectric:4.16.1"
}
